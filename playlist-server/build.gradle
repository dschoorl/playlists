plugins {
    id 'org.springframework.boot' version '3.5.13'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'idea'
    id 'eclipse'
}

repositories {
    mavenCentral()
}

group = 'info.rsdev'
version = '0.1.0-SNAPSHOT'
bootJar.archiveFileName="playlists.jar"

// use newer versions than managed by spring boot 3.5.13 because of vulnerabilities
ext['commons-lang3.version'] = '3.19.0'
ext['log4j2.version'] = '2.25.4'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

eclipse {
    classpath {
        downloadSources = true
        downloadJavadoc = true
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

task copyGUI(type: Copy) {
    from '../angular-client/dist/browser'
    into 'build/resources/main/static'
}

copyGUI.dependsOn(':angular-client:build')
processResources.dependsOn(copyGUI)

dependencies {
    implementation('org.springframework.boot:spring-boot-starter')
    implementation('org.springframework.boot:spring-boot-starter-logging')
    implementation('org.springframework.boot:spring-boot-starter-jdbc')
    implementation('org.springframework.boot:spring-boot-starter-web')
    implementation('org.liquibase:liquibase-core')
	implementation('org.mariadb.jdbc:mariadb-java-client')
    implementation("org.jsoup:jsoup:1.22.1")
    implementation("se.michaelthelin.spotify:spotify-web-api-java:7.1.0")
    implementation("info.debatty:java-string-similarity:2.0.0")
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude module: 'junit'
    }
    testImplementation('org.junit.jupiter:junit-jupiter-api')
    testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine')

    testImplementation('junit:junit')
    testRuntimeOnly('org.junit.vintage:junit-vintage-engine')
}

test {
    useJUnitPlatform()
}
