buildscript {
  repositories {
    maven {
      url "https://plugins.gradle.org/m2/"
    }
  }
  dependencies {
    classpath "org.owasp:dependency-check-gradle:12.2.0"
  }
}

subprojects {
    apply plugin: 'org.owasp.dependencycheck'
    
    dependencyCheck {
        nvd.apiKey = "${System.getenv('NVD_APIKEY')}"
    }
}
